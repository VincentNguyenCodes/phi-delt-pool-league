name: Keep scheduled workflows alive

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Commit even if the repo was active recently"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit if the repo has been quiet
        env:
          FORCE: ${{ inputs.force }}
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ "$FORCE" != "true" ] && [ $((now - last)) -lt $((30 * 86400)) ]; then
            echo "Recent activity, nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keep scheduled workflows alive"
          git push
